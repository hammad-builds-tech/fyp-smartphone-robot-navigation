amcl:
  ros__parameters:
    use_sim_time: true
    tf_broadcast: true
    # tolerate CPU-load TF timing jitter between scan stamps and map->odom
    transform_tolerance: 1.0
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    # Initialize localization automatically at the robot's spawn pose so the
    # map -> odom transform exists without any manual RViz interaction.
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: -2.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    max_beams: 60
    min_particles: 300
    max_particles: 2000

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/hammad/FYP/ros2_ws/src/indoor_nav_costmap/maps/indoor_map.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      transform_tolerance: 1.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    transform_tolerance: 1.0
    enable_stamped_cmd_vel: false
    controller_plugins: ["FollowPath"]
    # Detours around reconstructed obstacles are rotation-dominated at 0.22 m/s
    # under RTF<1; default (0.5 m / 15 s) progress checker aborted valid detours
    # with error 105 "Failed to make progress".
    progress_checker_plugin: "nav2_controller::SimpleProgressChecker"
    progress_checker.required_movement_radius: 0.15
    progress_checker.movement_time_allowance: 25.0

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      transform_tolerance: 1.0
      # Velocities match the fyp_robot's Gazebo differential drive limits.
      min_vel_x: 0.0
      # raised from 0.15 for clearly visible motion (user requirement)
      max_vel_x: 0.22
      min_vel_theta: -0.5
      max_vel_theta: 0.5
      acc_lim_x: 1.0
      decel_lim_x: -1.0
      acc_lim_theta: 1.0
      decel_lim_theta: -1.0
      # raised from 0.15 for clearly visible motion (user requirement)
      max_speed_xy: 0.22
      min_speed_xy: 0.0
      min_speed_theta: 0.2
      # shorter DWB horizon so 0.35 m/s sampled arcs stay legal in tight gaps
      sim_time: 1.2
      # Report-aligned critics (obstacle + inflation from the depth-derived
      # occupancy/costmap representation).
      # Oscillation critic removed: after the first reversal near a wall corner
      # it vetoed every trajectory (reset distance 0.05 m is unreachable in a
      # tight detour) => zero cmd_vel for minutes => error 105 aborts.
      critics: ["RotateToGoal", "BaseObstacle", "PathAlign", "GoalAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_distance: 0.25
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      sim_period: 0.1

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    observation_sources: ["scan"]

    polygons: ["PolygonStop"]

    PolygonStop:
      type: "polygon"
      points: "[[0.45, 0.30], [0.45, -0.30], [-0.20, -0.30], [-0.20, 0.30]]"
      action_type: "stop"
      min_points: 3
      visualize: false

    scan:
      type: "scan"
      topic: /scan
      source_timeout: 0.5
      enabled: true

global_costmap:
  global_costmap:
    ros__parameters:
      # controller_server/planner read transform_tolerance from the costmap
      transform_tolerance: 1.0
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # Real chassis is 0.7 x 0.5 m (wheels at +/-0.32); a 0.40 m circular
      # radius made the ~0.5 m corridor along the reconstructed wall edge
      # unplannable and corner-hugging aborts inevitable.
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      update_frequency: 2.0
      publish_frequency: 2.0

      # Report pipeline: the smartphone depth-derived occupancy grid
      # (depth -> point cloud -> filter -> 2D grid, republished by
      # pointcloud_costmap_layer) is ingested as a continuously refreshed
      # map-layer, replacing the previous LaserScan-based obstacle layer.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      # controller_server reads transform_tolerance from the costmap in this Nav2
      transform_tolerance: 1.0
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      # Real chassis footprint (see global_costmap note); inscribed radius 0.25.
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      # Unknown cells in the rolling local window are NOT obstacles (the global
      # planner refuses to enter unknown space; the local controller must be
      # allowed to drive along the known/unknown boundary while detouring).
      track_unknown_space: false

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

      # Keep the pre-existing scan topic resolvable for observation-buffer
      # defaults; the layer above is disabled because the report defines the
      # perception representation as an occupancy grid, not a LaserScan.
      always_send_full_costmap: true

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
